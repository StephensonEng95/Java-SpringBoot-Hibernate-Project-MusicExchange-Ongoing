<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fan Dashboard - MusicExchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">MusicExchange</a>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="row mb-4">
        <div class="col">
            <h2>Welcome, <span th:text="${fan.username}"></span></h2>
            <p class="text-muted">Discover and follow your favorite artists below.</p>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4 mb-4" th:each="artist : ${artists}">
            <div class="card h-100 shadow-sm">
                <img th:src="${artist.profilePic}" class="card-img-top" alt="Artist Profile" style="height: 200px; object-fit: cover;">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${artist.username}">Artist Name</h5>
                    <p class="card-text text-muted" th:text="${artist.genre}">Genre</p>
                    <div class="mt-auto">
                        <form th:action="@{/fan/follow/{id}(id=${artist.id})}" method="post">
                            <button type="submit" class="btn btn-outline-primary btn-sm w-100">Follow</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
