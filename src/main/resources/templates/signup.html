<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Join MusicExchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* This CSS handles the layout and makes the form look like a modern card */
        body {
            background-color: #f4f7f6;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .signup-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
        }
        .brand-link {
            text-align: center;
            margin-bottom: 20px;
            display: block;
            text-decoration: none;
            color: #007bff;
            font-weight: 700;
            font-size: 1.5rem;
        }
        h2 { margin-bottom: 8px; font-weight: 600; text-align: center; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 24px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #444; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus { outline-color: #007bff; border-color: #007bff; }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .role-option {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        /* This changes the background color when you select Artist or Fan */
        .role-option:has(input:checked) {
            border-color: #007bff;
            background-color: #f0f7ff;
        }
        input[type="radio"] { width: auto; margin-right: 5px; cursor: pointer; }

        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover { background-color: #218838; }

        .footer-link { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
        .footer-link a { color: #007bff; text-decoration: none; font-weight: 600; }

        /* Style for the error message that pops up if signup fails */
        .alert { padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: center; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
<div class="signup-card">
    <a th:href="@{/}" class="brand-link">MusicExchange</a>

    <h2>Create Account</h2>
    <p class="subtitle">Join our community of music lovers</p>

    <!-- This error alert only shows up if the Controller adds 'error' to the model -->
    <div th:if="${error}" class="alert alert-error" th:text="${error}">
        Something went wrong!
    </div>

    <!-- The form sends a POST request to the /signup URL in our UserController -->
    <form th:action="@{/signup}" method="post">

        <label>I am a...</label>
        <div class="role-selector">
            <!-- The 'name="role"' must match our UserRole enum values: ARTIST or FAN -->
            <div class="role-option">
                <input type="radio" id="artist" name="role" value="ARTIST" required>
                <label for="artist" style="display:inline; cursor:pointer;">Artist</label>
            </div>
            <div class="role-option">
                <input type="radio" id="fan" name="role" value="FAN" required>
                <label for="fan" style="display:inline; cursor:pointer;">Fan</label>
            </div>
        </div>

        <!-- Each 'name' attribute here matches a @RequestParam in our Controller -->
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="johndoe123" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit">Create Account</button>
    </form>

    <div class="footer-link">
        Already a member? <a th:href="@{/login}">Log In</a>
    </div>
</div>
</body>
</html>
