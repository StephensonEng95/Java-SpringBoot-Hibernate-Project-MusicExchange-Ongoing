<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - Music Exchange</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h2 {
            color: #333333;
            margin-bottom: 0.75rem;
            font-size: 1.8rem;
        }

        p {
            color: #666666;
            margin-bottom: 1.75rem;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            background-color: #0066cc;
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Logged Out</h2>
    <p>You have been successfully logged out of your session.</p>
    <a href="/login" class="btn">Log In Again</a>
</div>

</body>
</html>
