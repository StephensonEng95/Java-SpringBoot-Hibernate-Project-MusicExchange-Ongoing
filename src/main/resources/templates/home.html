<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicExchange | Discover & Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007bff;
            --dark: #1a1a1a;
            --light-bg: #f8f9fa;
        }
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .hero-card {
            text-align: center;
            background: white;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            max-width: 500px;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        .hero-card p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 40px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            padding: 15px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .btn-outline {
            border: 2px solid #ddd;
            color: #555;
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
    </style>
</head>
<body>
<div class="hero-card">
    <div class="logo">MusicExchange</div>

    <!-- This greeting only shows up if someone is already logged in -->
    <p th:if="${session.user != null}">
        Welcome back, <b th:text="${session.user.username}">Artist</b>! Ready to manage your music?
    </p>

    <!-- This standard message shows up for guests who aren't logged in -->
    <p th:if="${session.user == null}">
        The premier marketplace for artists to showcase talent and fans to discover the next big thing.
    </p>

    <div class="btn-group">
        <!-- 1. If the user IS NOT logged in, show Signup and Login buttons -->
        <div th:if="${session.user == null}" class="btn-group">
            <a th:href="@{/signup}" class="btn btn-primary">Get Started for Free</a>
            <a th:href="@{/login}" class="btn btn-outline">Sign In to Your Account</a>
        </div>

        <!-- 2. If the user IS logged in, show Dashboard and Logout instead -->
        <div th:if="${session.user != null}" class="btn-group">
            <a th:href="@{/artist/dashboard}" class="btn btn-primary">Go to My Dashboard</a>
            <a th:href="@{/logout}" class="btn btn-outline">Log Out</a>
        </div>
    </div>
</div>
</body>
</html>
