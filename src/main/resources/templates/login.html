<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MusicExchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --white: #ffffff;
            --error-red: #dc3545;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background-color: var(--white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .brand-link {
            text-align: center;
            margin-bottom: 20px;
            display: block;
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.5rem;
        }

        .login-card h2 {
            color: var(--text-color);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .login-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .login-card input {
            width: 100%;
            padding: 12px 15px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        .login-card input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-card button:hover {
            background-color: var(--primary-hover);
        }

        .signup-link {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .signup-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .error-message {
            background-color: #f8d7da;
            color: var(--error-red);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            border: 1px solid #f5c6cb;
        }

        .logout-message {
            background-color: #d1ecf1;
            color: #0c5460;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>

<div class="login-card">
    <a th:href="@{/}" class="brand-link">MusicExchange</a>

    <h2>Welcome Back</h2>
    <p>Sign in to continue to your dashboard</p>

    <div th:if="${param.error != null or error != null}" class="error-message">
        Invalid username or password. Please try again.
    </div>

    <div th:if="${param.logout != null}" class="logout-message">
        You have been logged out.
    </div>

    <form th:action="@{/login}" method="post">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf}" />

        <div class="form-group">
            <input type="text" id="username" name="username" placeholder="Username" required>
        </div>

        <div class="form-group">
            <input type="password" id="password" name="password" placeholder="Password" required>
        </div>

        <button type="submit">Log In</button>
    </form>

    <div class="signup-link">
        Don't have an account? <a th:href="@{/signup}">Sign Up</a>
    </div>
</div>

</body>
</html>
